name: Sync Backend to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.PITCHCRAFT_AI }}
        run: git push --force https://moyez48:$HF_TOKEN@huggingface.co/spaces/moyez48/pitchcraft-api main
