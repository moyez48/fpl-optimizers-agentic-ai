name: FPL CSV auto-update

# Merge + feature-engineered CSV commit when a new GW has finished.
# Twice daily (cheap no-op via bootstrap-vs-CSV probe when nothing new).
on:
  schedule:
    - cron: '25 6,18 * * *'
  workflow_dispatch: # Adds a button so you can run it manually anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests xgboost scikit-learn

      - name: Run Data Update Script
        run: python update_data.py

      - name: Commit and Push new CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed_fpl_data.csv
          git commit -m "Auto-update FPL features for new Gameweek" || echo "No changes to commit"
          git push

      # Optional: Vercel "Deploy Hooks" redeploy Preview/Production when bot pushes
      # are ignored. Add secret VERCEL_DEPLOY_HOOK_URL in repo Settings → Secrets.
      - name: Trigger Vercel deploy hook (optional)
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then echo "VERCEL_DEPLOY_HOOK_URL unset — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK_URL" || echo "Deploy hook POST failed (check Vercel dashboard)"
