name: FPL CSV auto-update

on:
  schedule:
    - cron: '25 6,18 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests xgboost scikit-learn

      - name: Run Data Update Script
        run: python update_data.py

      - name: Commit and Push new CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed_fpl_data.csv
          git commit -m "Auto-update FPL features for new Gameweek" || echo "No changes to commit"
          git push
